<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Кастомная озвучка MCHOSE V9 Pro, V9 Turbo+, V9 Turbo, X9 и G9 Pro: обрезка аудио, AAC/ACT и сборка прошивки в браузере."
    />
    <meta name="theme-color" content="#f2f4f7" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Кастомные звуки MCHOSE V9 Pro, V9 Turbo и X9 | Voice Lab</title>
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zaqvierm.github.io/mchose-voice-lab/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MCHOSE Voice Lab" />
    <meta
      property="og:url"
      content="https://zaqvierm.github.io/mchose-voice-lab/"
    />
    <meta
      property="og:title"
      content="Кастомные звуки MCHOSE V9 Pro, V9 Turbo и X9 | Voice Lab"
    />
    <meta
      property="og:description"
      content="Своя озвучка для наушников MCHOSE: выбор оригинальной базы, обрезка аудио и сборка прошивки в браузере."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://zaqvierm.github.io/mchose-voice-lab/#app",
        "name": "MCHOSE Voice Lab",
        "url": "https://zaqvierm.github.io/mchose-voice-lab/",
        "description": "Браузерный редактор озвучки наушников MCHOSE: выбор оригинальной прошивки, обрезка аудио, кодирование AAC/ACT и сборка изменённого образа. Обработка пользовательских файлов выполняется локально; установка прошивки — отдельно через официальный обновлятор.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "inLanguage": [
          "ru",
          "en",
          "zh-Hans"
        ],
        "isAccessibleForFree": true,
        "license": "https://github.com/Zaqvierm/mchose-voice-lab/blob/main/LICENSE",
        "sameAs": "https://github.com/Zaqvierm/mchose-voice-lab",
        "author": {
          "@type": "Person",
          "name": "Zaqvierm",
          "url": "https://github.com/Zaqvierm"
        }
      }
    </script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="./">MCHOSE <span>Voice Lab</span></a>
      <nav>
        <a
          id="research-link"
          href="https://github.com/Zaqvierm/mchose-voice-lab/blob/main/docs/research.ru.md"
          data-i18n="research"
          target="_blank"
          rel="noreferrer"
          >Исследование</a
        ><a
          data-i18n="source"
          href="https://github.com/Zaqvierm/mchose-voice-lab"
          target="_blank"
          rel="noreferrer"
          >Исходный код</a
        ><span class="language-switch" title="Language / Язык / 语言">
          <svg
            viewBox="0 0 24 24"
            width="17"
            height="17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <ellipse cx="12" cy="12" rx="4" ry="9" />
            <path d="M3 12h18" />
          </svg>
          <img
            id="language-flag"
            src="./flags/ru.svg"
            width="21"
            height="14"
            alt=""
            aria-hidden="true"
          />
          <select id="ui-language" aria-label="Language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="zh">简体中文</option>
          </select>
        </span>
      </nav>
    </header>
    <main>
      <div class="page-title">
        <h1 data-i18n="title">Редактор озвучки</h1>
        <p data-i18n="intro"></p>
      </div>
      <div class="risk-note" role="note">
        <strong data-i18n="riskTitle"></strong>
        <span data-i18n="riskNotice"></span>
        <a
          data-i18n="disclaimer"
          href="https://github.com/Zaqvierm/mchose-voice-lab/blob/main/DISCLAIMER.md"
          target="_blank"
          rel="noreferrer"
        ></a>
      </div>
      <div class="workbench">
        <aside class="firmware-panel">
          <h2 data-i18n="firmware"></h2>
          <div class="source-switch">
            <label
              ><input
                type="radio"
                name="base-source"
                value="catalog"
                checked /><span data-i18n="catalog"></span></label
            ><label
              ><input type="radio" name="base-source" value="own" /><span
                data-i18n="own"
              ></span
            ></label>
          </div>
          <div id="catalog-source">
            <label for="model-select" data-i18n="model"></label
            ><select id="model-select" disabled></select
            ><label for="firmware-language" data-i18n="language"></label
            ><select id="firmware-language" disabled></select>
            <p id="catalog-version" class="fine"></p>
            <button
              id="load-stock"
              class="primary"
              disabled
              data-i18n="loadStock"
            ></button
            ><a
              id="stock-download"
              data-i18n="stockDownload"
              hidden
              target="_blank"
              rel="noreferrer"
            ></a>
            <p class="fine" data-i18n="catalogScope"></p>
          </div>
          <div class="local-file">
            <button
              id="pick-base"
              class="secondary"
              data-i18n="pickBase"
            ></button
            ><input id="base-file" type="file" accept=".bin" hidden />
            <p class="fine" data-i18n="baseHint"></p>
          </div>
          <a
            class="official-updater"
            href="https://cdn.mchose.com.cn/OTA/PC/prod/index.html#/select"
            target="_blank"
            rel="noreferrer"
            data-i18n="pcUpdater"
          ></a>
          <div class="base-state">
            <span id="base-badge"></span
            ><strong id="base-name" data-i18n="baseEmpty"></strong>
            <p id="base-detail"></p>
          </div>
          <div class="profile-note">
            <span data-i18n="profile"></span
            ><strong id="profile-state" data-i18n="verifiedProfile"></strong>
          </div>
          <details class="install-note">
            <summary data-i18n="caution"></summary>
            <p data-i18n="cautionText"></p>
            <p data-i18n="support"></p>
            <a
              id="instructions-link"
              href="https://github.com/Zaqvierm/mchose-voice-lab/blob/main/docs/rebuild.ru.md"
              data-i18n="instructions"
              target="_blank"
              rel="noreferrer"
            ></a>
          </details>
        </aside>
        <div class="editor-panel">
          <section class="resource-section">
            <div class="section-title">
              <h2 data-i18n="target"></h2>
              <span id="resource-count"></span>
            </div>
            <select id="voice" disabled>
              <option data-i18n="chooseTarget"></option>
            </select>
            <p class="fine" data-i18n="inspection"></p>
            <div class="original-row">
              <button
                id="play-original"
                class="small-button"
                disabled
                data-i18n="audition"
              ></button
              ><audio id="original-audio" controls hidden></audio>
            </div>
          </section>
          <section class="audio-section">
            <h2 data-i18n="audio"></h2>
            <div id="drop-zone" class="drop-zone">
              <div class="file-caption">
                <strong id="audio-name" data-i18n="drop"></strong
                ><span id="audio-detail" data-i18n="audioHint"></span>
              </div>
              <button
                id="pick-audio"
                class="secondary"
                data-i18n="pickAudio"
              ></button
              ><input id="audio-file" type="file" accept="audio/*" hidden />
            </div>
            <div id="editor" hidden>
              <div class="wave-head">
                <span data-i18n="previewFile"></span
                ><span id="clip-duration"></span>
              </div>
              <canvas
                id="wave"
                width="1000"
                height="200"
                aria-label="Audio waveform"
              ></canvas>
              <div class="range-grid">
                <label
                  ><span data-i18n="start"></span
                  ><input
                    id="clip-start"
                    type="number"
                    min="0"
                    value="0"
                    step="0.01" /></label
                ><label
                  ><span data-i18n="end"></span
                  ><input
                    id="clip-end"
                    type="number"
                    min="0"
                    value="2"
                    step="0.01" /></label
                ><button
                  id="play-clip"
                  class="small-button"
                  data-i18n="playClip"
                ></button>
              </div>
              <div class="sliders">
                <input
                  id="start-slider"
                  aria-label="Start"
                  type="range"
                  min="0"
                  max="1"
                  value="0"
                  step="0.01"
                /><input
                  id="end-slider"
                  aria-label="End"
                  type="range"
                  min="0"
                  max="1"
                  value="1"
                  step="0.01"
                />
              </div>
              <p class="fine" data-i18n="waveHint"></p>
              <button
                id="prepare"
                class="secondary"
                data-i18n="process"
              ></button>
            </div>
            <div id="preview-panel" class="preview-panel" hidden>
              <strong data-i18n="prepared"></strong>
              <p class="fine" data-i18n="preparedHint"></p>
              <audio id="prepared-audio" controls></audio
              ><button
                id="download-act"
                class="text-button"
                data-i18n="downloadAct"
              ></button>
            </div>
          </section>
          <div class="build-section">
            <p class="local-note" data-i18n="local"></p>
            <button
              id="build"
              class="primary"
              disabled
              data-i18n="build"
            ></button>
          </div>
          <div id="result" class="result" hidden>
            <h3 data-i18n="done"></h3>
            <p data-i18n="protected"></p>
            <p data-i18n="resourcesKept"></p>
            <p id="result-size"></p>
            <button id="download" class="primary" data-i18n="download"></button
            ><button
              id="download-report"
              class="text-button"
              data-i18n="report"
            ></button>
            <p class="fine" data-i18n="doneHint"></p>
            <a
              class="official-updater"
              href="https://cdn.mchose.com.cn/OTA/PC/prod/index.html#/select"
              target="_blank"
              rel="noreferrer"
              data-i18n="pcUpdater"
            ></a>
          </div>
          <div
            id="status"
            role="status"
            aria-live="polite"
            class="status"
            data-i18n="ready"
          ></div>
        </div>
      </div>
    </main>
    <footer>
      <div>
        <span id="app-version" class="app-version"></span>
        <span data-i18n="aiCredit"></span>
        <a
          data-i18n="authors"
          href="https://github.com/Zaqvierm/mchose-voice-lab/blob/main/CONTRIBUTORS.md"
          target="_blank"
          rel="noreferrer"
        ></a>
      </div>
      <p data-i18n="unofficial"></p>
    </footer>
    <script type="module" src="/src/main.mjs"></script>
  </body>
</html>
